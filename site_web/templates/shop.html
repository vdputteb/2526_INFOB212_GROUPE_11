{% extends "base.html" %}

{% block content %}

<!-- CSS -->
<link rel="stylesheet" href="{{ url_for('static', path='css/shop.css') }}">
<!-- JS-->
<script src="{{ url_for('static', path='js/catalogue.js') }}" defer></script>

<section class="banner">
    <h2>Louez ou achetez le balai qu'il vous faut</h2>
    <p>Du balai traditionnel au balai mécanique, trouvez l'outil idéal pour vos besoins professionnels ou domestiques</p>
    <div class="search-bar">
        <input type="text" placeholder="Rechercher un balai (ex: balai mécanique, franges...)" id="searchInput">
        <button onclick="searchBrooms()">Rechercher</button>
    </div>
</section>

<section class="filters">
    <div class="filter-group">
        <label for="type">Type :</label>
        <select id="type" onchange="filterBrooms()">
            <option value="all">Tous les types</option>
            <option value="traditionnel">Traditionnel</option>
            <option value="mecanique">Mécanique</option>
            <option value="industrie">Industriel</option>
            <option value="exterieur">Extérieur</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="prix">Prix /jour :</label>
        <select id="prix" onchange="filterBrooms()">
            <option value="all">Tous les prix</option>
            <option value="0-5">Moins de 5€</option>
            <option value="5-10">5€ - 10€</option>
            <option value="10-20">10€ - 20€</option>
            <option value="20+">Plus de 20€</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="stock">Disponibilité :</label>
        <select id="stock" onchange="filterBrooms()">
            <option value="all">Tous</option>
            <option value="disponible">Disponibles</option>
            <option value="faible">Stock faible</option>
        </select>
    </div>

    <div class="filter-group">
        <span>🔍 <span id="resultCount">9</span> balais trouvés</span>
    </div>
</section>

<main class="catalogue">
    <div class="section-title">
        <h2>Notre sélection de balais</h2>
        <div class="result-count">Trier par :
            <select onchange="sortBrooms(this.value)">
                <option value="recommandes">Recommandés</option>
                <option value="prix-croissant">Prix croissant</option>
                <option value="prix-decroissant">Prix décroissant</option>
                <option value="nom">Nom</option>
            </select>
        </div>
    </div>

    <div class="broom-grid" id="broomGrid">
        <!-- Les balais seront générés ici par JavaScript -->
    </div>

    <div class="pagination">
        <a href="#">&laquo;</a>
        <a href="#" class="active">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <a href="#">&raquo;</a>
    </div>
</main>

{% endblock %}
