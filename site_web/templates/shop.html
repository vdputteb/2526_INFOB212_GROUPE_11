{% extends "base.html" %}

{% block content %}

<!-- CSS -->
<link rel="stylesheet" href="{{ url_for('static', path='css/shop.css') }}">
<!-- JS-->
<script type = "module" src="{{ url_for('static', path='js/shop/shop_main.js') }}"></script>

<section class="banner">
    <h2>Louez ou achetez le balai qu'il vous faut</h2>
    <p>Du balai traditionnel au balai magique, trouvez l'outil idéal pour vos besoins professionnels ou domestiques</p>
    <div class="search-bar">
        <input type="text" placeholder="Rechercher un balai (ex: balai mécanique, volant...)" id="searchInput">
        <button onclick="searchBrooms()">Rechercher</button>
    </div>
</section>

<section class="filters">
    <div class="filter-group">
        <label for="category">Catégorie :</label>
        <select id="category" onchange="filterBrooms()">
            <option value="all">Toutes les catégories</option>
            <option value="non_magique">Non-magique</option>
            <option value="magique">Magique ✨</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="prix">Prix location /jour :</label>
        <select id="prix" onchange="filterBrooms()">
            <option value="all">Tous les prix</option>
            <option value="0-5">Moins de 5€</option>
            <option value="5-10">5€ - 10€</option>
            <option value="10-20">10€ - 20€</option>
            <option value="20+">Plus de 20€</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="prixVente">Prix vente :</label>
        <select id="prixVente" onchange="filterBrooms()">
            <option value="all">Tous les prix</option>
            <option value="0-30">Moins de 30€</option>
            <option value="30-60">30€ - 60€</option>
            <option value="60-100">60€ - 100€</option>
            <option value="100+">Plus de 100€</option>
        </select>
    </div>

    <div class="filter-group">
        <label for="stock">Disponibilité :</label>
        <select id="stock" onchange="filterBrooms()">
            <option value="all">Tous</option>
            <option value="disponible">Disponibles</option>
            <option value="faible">Stock faible</option>
        </select>
    </div>

    <div class="filter-group">
        <span>🔍 <span id="resultCount">9</span> balais trouvés</span>
    </div>
</section>

<main class="catalogue">
    <div class="section-title">
        <h2>Notre sélection de balais</h2>
        <div class="result-count">Trier par :
            <select onchange="sortBrooms(this.value)">
                <option value="recommandes">Recommandés</option>
                <option value="prix-croissant">Prix location croissant</option>
                <option value="prix-decroissant">Prix location décroissant</option>
                <option value="prix-vente-croissant">Prix vente croissant</option>
                <option value="prix-vente-decroissant">Prix vente décroissant</option>
                <option value="nom">Nom</option>
            </select>
        </div>
    </div>

    <div class="broom-grid" id="broomGrid">
        <!-- Les balais seront générés ici par JavaScript -->
    </div>

    <div class="pagination">
        <!-- La pagination sera générée par JavaScript -->
    </div>
</main>

{% endblock %}
